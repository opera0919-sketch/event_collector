name: pension-events

# 주의: 정기(schedule) 실행은 기본 브랜치(main) 코드로 돈다.
# 파이프라인 개선 PR 은 main 에 머지돼야 정기 실행에 반영된다 (REDESIGN.md §7).
on:
  schedule:
    # 월~금 06:07 KST (= 일~목 21:07 UTC). 종전 '30 22'(07:30 KST)는 GitHub 예약 실행이
    # 몰리는 시간대라 시작 지연 중앙값이 57분(7월) → 243분(11월)으로 늘어 리포트가 11:30
    # 전후에 도착했다. 정시·30분을 피한 분으로 옮기고 지연 여유를 앞에 둔다.
    # 날짜는 코드가 한국 시간으로 계산하므로(config.today_kst) UTC 로는 전날이어도 무방하다.
    - cron: '7 21 * * 0-4'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run monitor
        env:
          PYTHONUNBUFFERED: '1'   # 로그 줄마다 실제 시각이 찍히게 (버퍼링 시 전부 종료 시각)
          # 'weekly' = 예약 실행(평일 매일). DB 제약이 weekly|manual 만 허용해 이름을 유지한다.
          TRIGGER_TYPE: ${{ github.event_name == 'schedule' && 'weekly' || 'manual' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MAIL_SENDER: ${{ secrets.MAIL_SENDER }}
          MAIL_APP_PASSWORD: ${{ secrets.MAIL_APP_PASSWORD }}
          MAIL_RECIPIENTS: ${{ secrets.MAIL_RECIPIENTS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m pension_monitor.main

      - name: Commit data & report
        if: always()   # 메일 발송 실패 시에도 수집 결과는 보존
        run: |
          # 동시 실행(정기 + 수동) 시 'pull --rebase || true' 가 충돌을 삼켜 산출물 커밋이
          # 조용히 유실되던 문제(2026-09-04 실측) 보강: 산출물을 따로 보관한 뒤 원격 최신
          # 커밋 위에 그대로 얹는다(생성 파일은 최신 실행이 이긴다). 푸시 거부 시 3회 재시도,
          # 끝내 실패하면 잡을 실패로 표시해 Step Summary 에서 보이게 한다.
          set -e
          BR="${{ github.ref_name }}"
          git config user.name "pension-monitor-bot"
          git config user.email "noreply@github.com"
          OUT="$(mktemp -d)"
          cp -r data reports "$OUT"/
          for i in 1 2 3; do
            git fetch -q origin "$BR"
            git checkout -q -f "origin/$BR"
            cp -r "$OUT"/data "$OUT"/reports .
            git add data/ reports/
            if git diff --cached --quiet; then
              echo "변경 없음"; exit 0
            fi
            git commit -q -m "chore: 연금 이벤트 수집 결과 $(TZ=Asia/Seoul date +%Y-%m-%d) (${{ github.event_name }})"
            if git push origin "HEAD:$BR"; then
              echo "푸시 완료 (시도 $i)"; exit 0
            fi
            echo "푸시 거부(동시 실행 추정) — 재시도 $i/3"
            sleep $((i * 5))
          done
          echo "::error::수집 결과 커밋/푸시 실패 — data/·reports/ 가 저장소에 반영되지 않았습니다"
          exit 1

# Secrets 등록 후 통합 테스트 트리거 3 (앱 비밀번호 교체 확인)
