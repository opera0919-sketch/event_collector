name: probe-sources

on:
  workflow_dispatch:
    inputs:
      target:
        description: '조사 대상 (sources=전체 소스 구조, mirae=미래에셋 대체 경로)'
        type: choice
        options: [sources, mirae]
        default: sources
  push:
    branches:
      - claude/pension-event-monitoring-8lfq26
      - claude/pension-event-data-collection-u6gtn1
    paths:
      - 'scripts/probe_sources.py'
      - '.github/workflows/probe-sources.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install deps
        run: |
          pip install playwright requests beautifulsoup4
          playwright install --with-deps chromium
      - name: Run probe
        env:
          PYTHONUNBUFFERED: '1'
        run: python scripts/probe_${{ inputs.target || 'sources' }}.py
      - name: Commit findings
        if: always()
        run: |
          git config user.name "pension-monitor-bot"
          git config user.email "noreply@github.com"
          git add data/probe_findings.json data/probe_mirae.json 2>/dev/null || git add data/probe_findings.json || true
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "chore: 소스 조사 결과 probe_findings.json"
            git pull --rebase origin ${{ github.ref_name }} || true
            git push origin HEAD:${{ github.ref_name }}
          fi
